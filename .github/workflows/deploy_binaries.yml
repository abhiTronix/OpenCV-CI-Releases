name: Release OpenCV Binaries

on:
  push:
    branches:
      - main
    tags:
      - "*"
  schedule:
    - cron: "0 0 14,28 * *"

permissions:
  contents: write

jobs:
  create_gitrelease:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      output2: ${{ steps.rel_name.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: run check script
        run: bash check_old_assets.sh
        shell: bash
        if: github.event_name != 'push'
      - name: Get Release Name
        id: rel_name
        run: |
          TAGNAME="build-$(date +'%Y-%m-%d-%H-%M')"
          echo "tag_name=${TAGNAME}" >> "$GITHUB_OUTPUT"
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[RELEASE]')
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel_name.outputs.tag_name }}
          name: Release ${{ steps.rel_name.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[RELEASE]')
      
  build_n_upload:
    name: Build-Upload OpenCV Binaries
    needs: create_gitrelease
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: install_dependencies pip
        run: |
          pip install -U pip wheel numpy
        if: success()
      - name: run script
        run: bash create_opencv.sh
        shell: bash
        if: success()
      - name: display script ENVS
        run: |
          echo $OPENCV_NAME
          echo $OPENCV_PATHNAME
        if: success()
      - name: Upload Assets
        id: upload-assets
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.OPENCV_PATHNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.create_gitrelease.outputs.output2 }}
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[RELEASE]')
